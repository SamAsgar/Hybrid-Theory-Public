<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Hybrid-Theory — eenvoudige netwerktopologie (stand 20 november 2026)</title>
  <desc id="d">Vereenvoudigd overzicht: internet en thuisnetwerk buiten de labscope, één labhost met VMware, pfSense als centrale firewall en de zones MGMT, LAB en OT, plus een losstaand GNS3-testnet. Geen adressen; illustratie, geen testbewijs.</desc>
  <defs>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1a7f37"/></marker>
  </defs>
  <rect width="1000" height="720" fill="#ffffff"/>

  <!-- Titel -->
  <text x="500" y="34" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2328">Hybrid-Theory · netwerktopologie in één oogopslag</text>
  <text x="500" y="56" text-anchor="middle" font-size="13" fill="#57606a">Vereenvoudigd · stand 20 november 2026 · geen adressen · illustratie, geen testbewijs</text>

  <!-- Internet + thuisnetwerk -->
  <rect x="420" y="74" width="160" height="40" rx="20" fill="#f6f8fa" stroke="#8c959f" stroke-width="1.5"/>
  <text x="500" y="99" text-anchor="middle" font-size="15" font-weight="600" fill="#1f2328">Internet</text>
  <line x1="500" y1="114" x2="500" y2="134" stroke="#8c959f" stroke-width="2"/>
  <rect x="300" y="134" width="400" height="56" rx="8" fill="#fafbfc" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="500" y="157" text-anchor="middle" font-size="14" font-weight="600" fill="#1f2328">Thuisnetwerk · thuisrouter</text>
  <text x="500" y="177" text-anchor="middle" font-size="12" fill="#57606a">buiten de labscope · niet beschermd door pfSense</text>
  <line x1="500" y1="190" x2="500" y2="222" stroke="#8c959f" stroke-width="2"/>
  <text x="510" y="211" font-size="12" fill="#57606a">fysieke uplink</text>

  <!-- Labhost -->
  <rect x="16" y="222" width="968" height="410" rx="12" fill="#f6f8fa" stroke="#57606a" stroke-width="1.5"/>
  <text x="36" y="248" font-size="14" font-weight="700" fill="#1f2328">Labhost · VMware Workstation Pro</text>

  <!-- WAN-SIM -->
  <line x1="500" y1="222" x2="500" y2="262" stroke="#8c959f" stroke-width="2"/>
  <rect x="380" y="232" width="240" height="24" rx="12" fill="#ffffff" stroke="#8c959f"/>
  <text x="500" y="249" text-anchor="middle" font-size="12" fill="#1f2328">WAN-SIM · VMware NAT (updates)</text>

  <!-- pfSense -->
  <rect x="340" y="268" width="320" height="64" rx="10" fill="#fff1e5" stroke="#bc4c00" stroke-width="2"/>
  <text x="500" y="295" text-anchor="middle" font-size="17" font-weight="700" fill="#1f2328">pfSense-firewall</text>
  <text x="500" y="317" text-anchor="middle" font-size="12.5" fill="#57606a">centrale router · standaard blokkeren tussen zones</text>

  <!-- Verbindingen pfSense → zones -->
  <path d="M400,332 L400,350 L140,350 L140,382" fill="none" stroke="#0969da" stroke-width="2.5"/>
  <line x1="460" y1="332" x2="390" y2="382" stroke="#8250df" stroke-width="2.5"/>
  <line x1="560" y1="332" x2="620" y2="382" stroke="#bc4c00" stroke-width="2.5"/>

  <!-- Zone MGMT -->
  <rect x="32" y="382" width="216" height="186" rx="10" fill="#ffffff" stroke="#0969da" stroke-width="2"/>
  <rect x="32" y="382" width="216" height="34" rx="10" fill="#ddf4ff"/>
  <rect x="32" y="400" width="216" height="16" fill="#ddf4ff"/>
  <text x="140" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#0969da">MGMT · beheer</text>
  <text x="48" y="440" font-size="13" fill="#1f2328">• Beheerbron (labhost)</text>
  <text x="48" y="463" font-size="13" fill="#1f2328">• pfSense-webbeheer</text>
  <text x="48" y="486" font-size="13" fill="#1f2328">• Ubuntu · Cockpit</text>
  <text x="48" y="509" font-size="13" fill="#1f2328">• GNS3-VM (beheer)</text>
  <text x="140" y="552" text-anchor="middle" font-size="11.5" fill="#57606a">host-only netwerk</text>

  <!-- Zone LAB -->
  <rect x="280" y="382" width="216" height="186" rx="10" fill="#ffffff" stroke="#8250df" stroke-width="2"/>
  <rect x="280" y="382" width="216" height="34" rx="10" fill="#fbefff"/>
  <rect x="280" y="400" width="216" height="16" fill="#fbefff"/>
  <text x="388" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#8250df">LAB · IT</text>
  <text x="296" y="440" font-size="13" fill="#1f2328">• DC01 · AD DS / DNS</text>
  <text x="296" y="463" font-size="13" fill="#1f2328">• CLIENT01 · Windows 11</text>
  <text x="296" y="486" font-size="13" fill="#1f2328">• Ubuntu Server</text>
  <text x="296" y="509" font-size="13" fill="#1f2328">• Wazuh SIEM (0 agents)</text>
  <text x="388" y="552" text-anchor="middle" font-size="11.5" fill="#57606a">LAN Segment · DHCP via pfSense</text>

  <!-- Zone OT -->
  <rect x="528" y="382" width="216" height="186" rx="10" fill="#ffffff" stroke="#bc4c00" stroke-width="2"/>
  <rect x="528" y="382" width="216" height="34" rx="10" fill="#fff1e5"/>
  <rect x="528" y="400" width="216" height="16" fill="#fff1e5"/>
  <text x="636" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#bc4c00">OT · industrieel</text>
  <rect x="548" y="428" width="176" height="34" rx="6" fill="#fff8f2" stroke="#bc4c00"/>
  <text x="636" y="450" text-anchor="middle" font-size="13" fill="#1f2328">FUXA01 · SCADA/HMI</text>
  <line x1="636" y1="462" x2="636" y2="488" stroke="#bc4c00" stroke-width="2"/>
  <text x="644" y="480" font-size="11.5" fill="#57606a">Modbus TCP/502</text>
  <rect x="548" y="488" width="176" height="34" rx="6" fill="#fff8f2" stroke="#bc4c00"/>
  <text x="636" y="510" text-anchor="middle" font-size="13" fill="#1f2328">PLC01 · OpenPLC</text>
  <text x="636" y="552" text-anchor="middle" font-size="11.5" fill="#57606a">eigen LAN Segment · geen internet</text>

  <!-- Geblokkeerd LAB ↔ OT -->
  <circle cx="512" cy="475" r="11" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
  <path d="M506,469 L518,481 M518,469 L506,481" stroke="#cf222e" stroke-width="2.5"/>

  <!-- Beheerpad MGMT → OT -->
  <path d="M140,568 L140,600 L636,600 L636,570" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#arrG)"/>
  <text x="388" y="618" text-anchor="middle" font-size="12" fill="#1a7f37">alleen webbeheer OpenPLC / FUXA, via pfSense en alleen vanaf de beheerbron</text>

  <!-- GNS3 -->
  <rect x="776" y="382" width="192" height="186" rx="10" fill="#ffffff" stroke="#8c959f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="872" y="405" text-anchor="middle" font-size="15" font-weight="700" fill="#57606a">GNS3-testnet</text>
  <text x="792" y="440" font-size="13" fill="#1f2328">• Virtuele switch</text>
  <text x="792" y="463" font-size="13" fill="#1f2328">• VPCS PC1 en PC2</text>
  <text x="792" y="486" font-size="13" fill="#1f2328">• Wireshark-capture</text>
  <text x="872" y="540" text-anchor="middle" font-size="11.5" fill="#57606a">losstaand · geen koppeling</text>
  <text x="872" y="556" text-anchor="middle" font-size="11.5" fill="#57606a">met pfSense of andere zones</text>

  <!-- Legenda -->
  <g font-size="12.5" fill="#1f2328">
    <line x1="40" y1="660" x2="80" y2="660" stroke="#57606a" stroke-width="2.5"/>
    <text x="88" y="664">netwerk achter pfSense</text>
    <line x1="260" y1="660" x2="300" y2="660" stroke="#1a7f37" stroke-width="2" stroke-dasharray="7 4"/>
    <text x="308" y="664">toegestaan beheerpad</text>
    <circle cx="478" cy="660" r="9" fill="#ffebe9" stroke="#cf222e" stroke-width="2"/>
    <path d="M473,655 L483,665 M483,655 L473,665" stroke="#cf222e" stroke-width="2"/>
    <text x="494" y="664">LAB ↔ OT geblokkeerd (getest binnen scope)</text>
    <rect x="790" y="651" width="34" height="18" rx="4" fill="none" stroke="#8c959f" stroke-dasharray="5 3"/>
    <text x="832" y="664">los / buiten scope</text>
  </g>
  <text x="500" y="698" text-anchor="middle" font-size="11.5" fill="#57606a">Integrale OT-isolatie (AC04/AC07) is nog niet bewezen. Details, aliassen en teststatus: diagram A1–A3 in architectuur/README.md.</text>
</svg>
